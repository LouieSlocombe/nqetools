[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nqetools"
version = "0.1.0"
description = "A centralised set of tools for doing nuclear quantum calculations."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "opt_einsum",
    "jax",
    "jaxlib",
    "ml_dtypes",
    "sympy",
    "pyfftw",
    "chemiscope",
    "ase",
    "i-pi",
    "py-plumed",
    "openmm",
    "openmm-ml",
    "torch",
    "nnpops",
    "openmm-torch",
    "openmmforcefields",
    "openmmtools",
    "ambertools",
    "pdbfixer",
    "rdkit",
    "mdanalysis",
    "mace-torch",
    "sella",
    "geodesic_interpolate @ git+https://github.com/LouieSlocombe/geodesic_interpolate.git",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "jupyterlab",
    "pytest",
]
notebook = [
    "jupyterlab",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/nqetools"
Repository = "https://github.com/LouieSlocombe/nqetools"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["nqetools", "nqetools.*"]

[tool.setuptools.package-data]
"nqetools" = [
    "templates/*",
    "thermostats/*",
    "opes/*",
    "instanton_tools/*",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E7", "E9", "F", "W", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", # unicode symbols (Å, Greek letters) in strings are intentional
    "RUF002", # same, in docstrings
    "RUF012", # ASE calculator convention: mutable class-attribute defaults
    "SIM102", # nested ifs kept where they read better
    "SIM105", # try/except/pass is fine without contextlib.suppress
    "SIM108", # explicit if/else preferred over ternary
    "SIM115", # OpenMM reporters hold file handles open across reports
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"nqetools/__init__.py" = ["F401"]
# PLUMED/driver input templates embedded as strings keep their exact whitespace
"nqetools/plumed.py" = ["W291", "W293"]
"nqetools/driver.py" = ["W291", "W293"]
# Adapted third-party scripts (PLUMED opes tools, ASE QChem calculator)
"nqetools/opes/*" = ["UP031", "RUF005", "E741"]
"nqetools/qchem_mod.py" = ["UP031"]
# `l` is the conventional lambda-state index in the MBAR loop
"tests/test_openmm.py" = ["E741"]
