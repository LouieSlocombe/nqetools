[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nqetools"
version = "0.1.0"
description = "A centralised set of tools for doing nuclear quantum calculations."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "ase",
    "i-pi",
    "py-plumed",
    "openmm",
    "openmm-ml",
    "openmm-plumed",
    "openff-toolkit",
    "openmmforcefields",
    "openmmtools",
    "pdbfixer",
    "rdkit",
    "mdanalysis",
    "torch",
    "mace-torch",
    # Loaded dynamically rather than imported, so they look unused to a grep:
    # nnpops and openmm-torch back the MACE/ANI potentials in openmm-ml, and
    # ambertools supplies the parameterisation tools openmmforcefields shells
    # out to. Do not prune these as dead dependencies.
    "nnpops",
    "openmm-torch",
    "ambertools",
    "reactiontools @ git+https://github.com/LouieSlocombe/reactiontools.git",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pymbar", # tests/test_openmm.py uses MBAR for the free-energy checks
]
notebook = [
    "jupyterlab",
]
dev = [
    "nqetools[test,notebook]",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/nqetools"
Repository = "https://github.com/LouieSlocombe/nqetools"

[tool.setuptools]
# The package-data table below is the only source of non-Python files; nothing
# is picked up implicitly from a MANIFEST.in.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["nqetools", "nqetools.*"]
# templates/, thermostats/, opes/ and instanton_tools/ carry no __init__.py and
# are picked up as PEP 420 namespace packages. find_nqetools_path() in io.py
# resolves the opes/ and instanton_tools/ scripts by path at runtime and
# execution.py runs them as subprocesses, so this has to stay true.
namespaces = true

[tool.setuptools.package-data]
"nqetools.templates" = ["*.xml"]
"nqetools.thermostats" = ["*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E7", "E9", "F", "W", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", # unicode symbols (Å, Greek letters) in strings are intentional
    "RUF002", # same, in docstrings
    "RUF012", # ASE calculator convention: mutable class-attribute defaults
    "SIM102", # nested ifs kept where they read better
    "SIM105", # try/except/pass is fine without contextlib.suppress
    "SIM108", # explicit if/else preferred over ternary
    "SIM115", # OpenMM reporters hold file handles open across reports
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"nqetools/__init__.py" = ["F401"]
# Driver scripts embedded as strings keep their exact whitespace
"nqetools/driver.py" = ["W291", "W293"]
# Adapted third-party scripts (PLUMED opes tools, ASE QChem calculator)
"nqetools/opes/*" = ["UP031", "RUF005", "E741"]
"nqetools/qchem_mod.py" = ["UP031"]
# `l` is the conventional lambda-state index in the MBAR loop
"tests/test_openmm.py" = ["E741"]
